version: "2"

formatters:
  enable:
    - gofumpt
    - goimports

linters:
  default: standard  # errcheck, govet, ineffassign, staticcheck, unused (made explicit)
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - err113
    - embeddedstructfieldcheck
    - errcheck
    - errchkjson
    - errorlint
    - errname
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funcorder
    - gochecknoinits
    - gocheckcompilerdirectives
    - gochecksumtype
    - goconst
    - gocritic
    - godoclint
    - godot
    - godox
    - gomoddirectives
    - goprintffuncname
    - gosmopolitan
    - grouper
    - gosec
    - iface
    - importas
    - inamedparam
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - makezero
    - mirror
    - misspell
    - musttag
    - modernize
    - nakedret
    - nestif
    - nilerr
    - nlreturn
    - noinlineerr
    - noctx
    - nilnesserr
    - nilnil
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - reassign
    - recvcheck
    - revive
    - sloglint
    - tagalign
    - tagliatelle
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck
  settings:
    depguard:
      rules:
        # Ban discouraged packages everywhere. The repo imports none of these today;
        # this only prevents regressions.
        discouraged:
          deny:
            - pkg: io/ioutil
              desc: deprecated; use io and os
            - pkg: github.com/pkg/errors
              desc: use the stdlib errors package with %w
            - pkg: gopkg.in/yaml.v2
              desc: use go.yaml.in/yaml/v3
            - pkg: github.com/gogo/protobuf
              desc: unmaintained; use google.golang.org/protobuf
        # Lock the package dependency DAG: a new cross-package edge must be a
        # conscious edit here, not silent architectural drift. Leaf packages
        # (config, csv, model, drain) import no other package of this module;
        # their external tests may import the package under test.
        leaf-packages:
          files:
            - '**/config/**'
            - '**/internal/csv/**'
            - '**/internal/model/**'
            - '**/internal/drain/**'
            - '!$test'
          deny:
            - pkg: github.com/HBTGmbH/air-pollution-service/
              desc: leaf packages must not import other packages of this module
        # store may import only internal/csv and internal/model.
        store:
          files:
            - '**/internal/store/**'
          deny:
            - pkg: github.com/HBTGmbH/air-pollution-service/config
              desc: store may import only internal/csv and internal/model
            - pkg: github.com/HBTGmbH/air-pollution-service/internal/resource
              desc: store may import only internal/csv and internal/model
            - pkg: github.com/HBTGmbH/air-pollution-service/internal/drain
              desc: store may import only internal/csv and internal/model
        # resource may import only internal/model; it defines the Storage
        # interface it consumes instead of importing internal/store.
        resource:
          files:
            - '**/internal/resource/**'
          deny:
            - pkg: github.com/HBTGmbH/air-pollution-service/config
              desc: resource may import only internal/model
            - pkg: github.com/HBTGmbH/air-pollution-service/internal/csv
              desc: resource may import only internal/model
            - pkg: github.com/HBTGmbH/air-pollution-service/internal/drain
              desc: resource may import only internal/model
            - pkg: github.com/HBTGmbH/air-pollution-service/internal/store
              desc: resource may import only internal/model
    govet:
      enable-all: true
    iface:
      enable:
        - identical
        - opaque
        - unused
        - unexported
    sloglint:
      static-msg: true
      key-naming-case: snake
    errcheck:
      check-type-assertions: true
    staticcheck:
      checks: ["all"]
    forbidigo:
      forbid:
        - pattern: 'fmt\.Print(ln|f)?'
          msg: use log or slog for logging
        - pattern: '^print(ln)?$'
          msg: use log or slog for logging
    godoclint:
      enable:
        - no-unused-link
        - require-stdlib-doclink
    predeclared:
      qualified-name: true
    gocritic:
      enable-all: true
    exhaustive:
      default-signifies-exhaustive: true
    loggercheck:
      kitlog: false
      zap: false
      require-string-key: true
      no-printf-like: true
    gosec:
      config:
        global:
          audit: true
    nolintlint:
      require-explanation: true
      require-specific: true
    copyloopvar:
      check-alias: true
    embeddedstructfieldcheck:
      forbid-mutex: true         # embedded mutexes leak lock/unlock into the API surface
    errchkjson:
      check-error-free-encoding: true
    fatcontext:
      check-struct-pointers: true
    nonamedreturns:
      report-error-in-defer: true
    perfsprint:
      err-error: true            # prefer err.Error() over fmt.Sprintf("%s", err)
    tagliatelle:
      case:
        rules:
          json: snake            # the public REST API uses snake_case field names
    usestdlibvars:
      time-weekday: true
      time-month: true
      time-layout: true
      crypto-hash: true
    usetesting:
      context-background: true   # use t.Context() instead of context.Background()
      context-todo: true         # use t.Context() instead of context.TODO()
      os-temp-dir: true          # use t.TempDir() instead of os.TempDir()
    revive:
      enable-all-rules: true
      rules:
        - name: add-constant
          arguments:
            - allowInts: "0,1"
        - name: line-length-limit
          arguments:
            # Struct tags (e.g. in config.ConfServer) and swag annotations
            # cannot be wrapped, so the default of 80 is not attainable.
            - 120
  exclusions:
    rules:
      # Test fixtures and expected values are literals by nature; naming each
      # of them as a constant would make the tests harder to read.
      - path: _test\.go
        linters:
          - revive
        text: "add-constant:"
    # swag writes "// Package docs Code generated by swaggo/swag. DO NOT EDIT",
    # which only the lax detection recognizes as generated.
    generated: lax
