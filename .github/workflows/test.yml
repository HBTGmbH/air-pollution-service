name: Test

on:
  push:
    branches-ignore:
      - main
  workflow_call:

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"

      - name: Install Dependencies
        run: go get ./...

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./... -json > TestResults.json

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: Go-results
          path: TestResults.json

  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Not covered by Dependabot; bump manually alongside .golangci.yml.
          version: v2.15.0

      - name: Check Swagger annotations and generated docs are up to date
        run: |
          go tool swag fmt
          go tool swag init
          git diff --exit-code || {
            echo "::error::Swagger annotations or docs/ are out of date; run 'make swagger' and commit the result."
            exit 1
          }
